[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

; =============================
; 依赖关系（通过 priority + startsecs 实现）：
;
; priority=10:  xvfb gost securelink   (并行启动，无依赖)
; priority=20:  fluxbox                (依赖 xvfb 就绪)
; priority=30:  x11vnc xterm           (依赖 fluxbox 就绪)
; priority=40:  securelink_gui         (依赖 fluxbox + securelink)
; =============================

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx24 -listen tcp -ac
autorestart=unexpected
priority=10
startsecs=2
stopsignal=TERM
killasgroup=true
stopasgroup=true
redirect_stderr=true

[program:gost]
command=/usr/sbin/gost -L socks5://:10801 -L http://:18888
autorestart=unexpected
priority=10
startsecs=2
stopsignal=TERM
killasgroup=true
stopasgroup=true
redirect_stderr=true

[program:securelink]
; 使用 -d 参数会立即 fork 退出（exit 0），所以 startsecs=0
; supervisor 不重启（exit 0 是预期行为），子进程继续在后台运行
command=/opt/SecureLink/resources/app.asar.unpacked/assets/app-ext/securelink_linux64/bin/SecureLink_Client -d >/dev/null 2>&1
autorestart=unexpected
priority=10
startsecs=0
stopsignal=TERM
stopasgroup=true
redirect_stderr=true

[program:fluxbox]
command=/usr/sbin/fluxbox -display :99
autorestart=unexpected
priority=20
startsecs=2
stopsignal=TERM
killasgroup=true
stopasgroup=true
redirect_stderr=true

[program:x11vnc]
command=/usr/sbin/x11vnc -display :99 -forever -shared
autorestart=unexpected
priority=30
startsecs=2
stopsignal=TERM
killasgroup=true
stopasgroup=true
redirect_stderr=true

[program:xterm]
; 仅当 RUN_XTERM=yes 时启动真实的 xterm，否则空转等待
command=bash -c 'if [ "${RUN_XTERM}" = "yes" ]; then exec /usr/sbin/xterm; else exec tail -f /dev/null; fi'
autorestart=unexpected
priority=30
startsecs=1
stopsignal=TERM
killasgroup=true
stopasgroup=true
redirect_stderr=true

[program:securelink_gui]
command=/opt/SecureLink/securelink --no-sandbox
autorestart=false
priority=40
startsecs=5
stopsignal=TERM
killasgroup=true
stopasgroup=true
redirect_stderr=true
